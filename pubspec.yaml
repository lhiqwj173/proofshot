name: proofshot
description: 本地水印相机
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.1
  geolocator: 14.0.3
  geocoding: 5.0.0
  shared_preferences: 2.5.5

dependency_overrides:
  camera_avfoundation:
    path: vendor/camera_avfoundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  camera_platform_interface: 2.14.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
