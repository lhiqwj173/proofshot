workflows:
  ios-personal:
    name: Proofshot unsigned iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install locked Dart dependencies
        script: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          app_path="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          ipa_path="$CM_BUILD_DIR/build/ios/ipa/proofshot-unsigned.ipa"
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT

          test -d "$app_path"
          mkdir -p "$package_dir/Payload"
          cp -R "$app_path" "$package_dir/Payload/Runner.app"
          mkdir -p "$(dirname "$ipa_path")"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$package_dir/Payload" "$ipa_path"
          test -s "$ipa_path"
    artifacts:
      - build/ios/ipa/proofshot-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
